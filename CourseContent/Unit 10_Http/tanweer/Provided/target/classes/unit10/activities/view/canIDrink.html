<!DOCTYPE html>
<html lang="en">
<head>
    <title>Can I Drink?</title>
</head>
<body>

        <h1>Can I Drink?</h1>
        <form method="POST" action="http://localhost:8081">
            <p>
                <label>Enter your birthday:</label>
            </p>

    </div>

</html>
